{% extends "base.html" %}

{% block title %}Supprimer un étudiant · School Manager{% endblock %}

{% block content %}
    <h1>Supprimer l'étudiant</h1>
    <p>Voulez-vous vraiment supprimer <strong>{{ student.first_name }} {{ student.last_name }}</strong> ?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="danger">Oui, supprimer</button>
        <a href="{% url 'students:detail' student.id %}" class="button">Annuler</a>
    </form>
{% endblock %}
