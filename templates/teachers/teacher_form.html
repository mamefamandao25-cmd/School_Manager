{% extends "base.html" %}

{% block title %}{{ title }} · School Manager{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <div class="field">
                {{ field.label_tag }}
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}
        <button type="submit">Enregistrer</button>
        <a href="{% if teacher %}{% url 'teachers:detail' teacher.id %}{% else %}{% url 'teachers:list' %}{% endif %}" class="button">Annuler</a>
    </form>
{% endblock %}
