{% extends "base.html" %}

{% block title %}{{ title }} · School Manager{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>

    <form method="post">
        {% csrf_token %}
        <div class="form-grid">
            {{ form.as_p }}
        </div>
        <button type="submit">Enregistrer</button>
        <a href="{% if teacher %}{% url 'teacher_detail' teacher.id %}{% else %}{% url 'teacher_list' %}{% endif %}" class="button">Annuler</a>
    </form>
{% endblock %}
