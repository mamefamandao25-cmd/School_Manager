{% extends "base.html" %}

{% block title %}{{ teacher.first_name }} {{ teacher.last_name }}{% endblock %}

{% block content %}
    <a href="{% url 'teachers:list' %}">← Retour à la liste</a>
    <h1>{{ teacher.first_name }} {{ teacher.last_name }}</h1>
    <p>Email : {{ teacher.email }}</p>
    <p>Matière : {{ teacher.subject }}</p>

    <div class="actions">
        <a href="{% url 'teachers:update' teacher.id %}" class="button">Modifier</a>
        <a href="{% url 'teachers:delete' teacher.id %}" class="button danger">Supprimer</a>
    </div>
{% endblock %}
